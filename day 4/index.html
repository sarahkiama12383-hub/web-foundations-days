<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note Pad & Counter</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h2>Quick Draft</h2>
      <button id="theme-toggle" type="button">Dark mode</button>
    </header>

    <main class="editor-section">
      <label for="note-text" class="sr-only">Your note</label>
      <textarea id="note-text" placeholder="Type your thoughts here..."></textarea>

      <div class="metrics">
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>
      </div>

      <div class="actions">
        <button id="clear-btn" type="button">Clear</button>
      </div>
    </main>
  </div>
</body>
</html>
